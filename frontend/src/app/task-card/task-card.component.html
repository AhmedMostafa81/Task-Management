<div class="task-card">
    <div class="task-header">
        <h2 class="task-title">{{task.title}}</h2>
        <div class="task-meta">
            <div class="task-badge {{task.status}}">{{ task.status === 'DONE' ? 'DONE' : task.status }}</div>
            <div class="task-priority-badge {{ getPriorityClass(task.priority) }}">{{ getPriorityClass(task.priority) }}</div>
        </div>
    </div>
    <p class="task-desc">{{ task.description }}</p>
    <div class="task-footer">
        <div class="left-section"></div>
        <div class="right-section">
            <button (click)=onClickView(task.id) class="task-btn">View</button>
            <button (click)=onClickDelete(task.id,task.title) class="delete-btn task-btn">Delete</button>
        </div>
    </div>
</div>
