<main class="signUp-container">
    <h1 class="signUp-title">Sign Up</h1>

    <form class="signUp-form">

        <div class='my-alert my-alert-warning' *ngIf="showWarningMessage">{{warningMessage}}</div>

        <div class="form-group">
            <input type="text" name="username" class="form-input" placeholder="Username"  [(ngModel)]="username" required>
        </div>

        <div class="form-group">
            <input type="password" name="password" class="form-input" placeholder="Password" [(ngModel)]="password" required>
        </div>

         <!-- Confirm Password -->
        <div class="form-group">
            <input type="password" name="confirm-password" class="form-input" placeholder="Confirm Password" [(ngModel)]="confirmPassword" required>
        </div>

        <button  (click)=onSignup() type="button" class="btn-submit">Create Account</button>

        <!-- Already have an account? -->
        <p class="signup-text">
            Already have an account? <a routerLink= "/login">Login</a>
        </p>
    </form>

</main>
