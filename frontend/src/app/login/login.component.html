<main class="login-container">
    <h1 class="login-title">Login</h1>
    <div class='my-alert my-alert-warning' *ngIf="invalidLogin">Invalid Credentials</div>
    <form class="login-form">
        <div class="form-group">
            <input type="text" name="email" class="form-input" placeholder="Username" [(ngModel)]="username" required>
        </div>
        
        <div class="form-group">
            <input type="password" name="password" class="form-input" placeholder="Password" [(ngModel)]="password" required>
        </div>

        <button type="button" class="btn-submit" (click)=onLogin()>Sign In</button>
    </form>

    <p class="signup-text">
        Don't have an account? <a routerLink="/sign-up">Sign Up</a>
    </p>
</main>
